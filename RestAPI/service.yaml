# knative-service.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: image-api
  namespace: default
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
    spec:
      containers:
      - name: image-api
#        image: tomasconti02/rest-interface:v35
        image: tomasconti02/interface-rest:v10
        ports:
        - containerPort: 5000
        env:
        - name: ISTIO_GATEWAY
          value: "http://istio-ingressgateway.istio-system.svc.cluster.local" #internal cluster istio gataway dns 
        resources: # resource require and limitation 
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
