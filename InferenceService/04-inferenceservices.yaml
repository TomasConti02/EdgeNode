apiVersion: "serving.kserve.io/v1beta1"
kind: "InferenceService"
metadata:
  name: "simple-cnn"
  namespace: "default"
  annotations:
    serving.kserve.io/deploymentMode: "RawDeployment"
    sidecar.istio.io/inject: "false" # <--- Placed at the metadata level for the whole ISVC
spec:
  transformer:
    containers:
      - name: "kserve-container"
        image: "tomasconti02/cnn-transformer-key:v4"
        command:
          - python
          - -m
          - transformer
        args:
          - --model_names
          - "simple-cnn,simple-cnn-test"
          - --namespace
          - "default"
          - --predictor_port
          - "8080"
          - --broker
          - "http://kafka-broker-ingress.knative-eventing.svc.cluster.local/default/kafka-broker"
          - --broker_host
          - "kafka-broker-ingress.knative-eventing.svc.cluster.local"
          - --ce_type
          - "org.kubeflow.serving.inference.request"
  predictor:
    model:
      modelFormat:
        name: tensorflow
      storageUri: "pvc://simple-cnn-pvc/"
---
