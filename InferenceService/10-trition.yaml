apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: simple-cnn
  namespace: default
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    sidecar.istio.io/inject: "false"
spec:
  predictor:
    minReplicas: 1
    timeout: 60
    nodeSelector:
      kubernetes.io/hostname: nvidia-ca7
    volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: simple-cnn-pvc
    hostAliases:
      - ip: "127.0.0.1"
        hostnames:
          - "simple-cnn-predictor"
          - "simple-cnn-predictor.default"
          - "simple-cnn-predictor.default.svc.cluster.local"
    containers:
      - name: kserve-container
        image: tomasconti02/transformer_rpc:v16
        command:
          - python
          - -m
          - transformer
        args:
          - --model_names
          - "simple-cnn"
          - --namespace
          - "default"
          - --predictor_port
          - "8000"
          - --broker
          - "http://kafka-broker-ingress.knative-eventing.svc.cluster.local/default/kafka-broker"
          - --broker_host
          - "kafka-broker-ingress.knative-eventing.svc.cluster.local"
          - --ce_type
          - "org.kubeflow.serving.inference.request"
        env:
          - name: KSERVE_PROTOCOL_VERSION
            value: "v2"
          - name: WORKERS
            value: "4"
          - name: NUM_WORKERS
            value: "4"
          - name: TRACE
            value: "false"
          - name: UVICORN_ACCESS_LOG
            value: "0"
          - name: TF_CPP_MIN_LOG_LEVEL
            value: "3"
          - name: PYTHONWARNINGS
            value: "ignore"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        ports:
          - containerPort: 8080
            name: http1
            protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10

      - name: predictor
        image: nvcr.io/nvidia/tritonserver:23.10-py3
        command: ["tritonserver"]
        args:
          - --model-repository=/mnt/models
          - --http-port=8000
          - --grpc-port=8001
          - --metrics-port=8002
          - --cuda-memory-pool-byte-size=0:536870912
        env:
          - name: NVIDIA_VISIBLE_DEVICES
            value: "all"
          - name: NVIDIA_DRIVER_CAPABILITIES
            value: "compute,utility"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        volumeMounts:
          - name: model-storage
            mountPath: /mnt/models
        ports:
          - containerPort: 8000
            name: http
            protocol: TCP
        readinessProbe:
          httpGet:
            path: /v2/health/ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /v2/health/live
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10

