apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ood-detector
  namespace: default
spec:
  template:
    metadata:
      annotations:
        scale-to-zero-pod-retention-period: "60s"
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "1"
    spec:
      containerConcurrency: 100
      containers:
        - image: docker.io/tomasconti02/ood-detector-test:v23   # new image with image endpoints
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: fallback-storage
              mountPath: /data/queue
              readOnly: false
          env:
            - name: OOD_INITIAL_THRESHOLD
              value: "0.2"
            - name: OOD_SAFE_THRESHOLD
              value: "0.2"
            - name: OOD_WINDOW_SIZE
              value: "100"
            - name: OOD_BATCH_SIZE
              value: "20"
            - name: OOD_MIN_SAMPLES
              value: "20"
            - name: OOD_SMOOTHING
              value: "0.95"
            - name: OOD_PERCENTILE
              value: "95"
            - name: OOD_MAX_PERCENTILE
              value: "99"
            - name: OOD_MAX_CONSECUTIVE_DROPS
              value: "3"
            - name: OOD_MAX_CONSECUTIVE_UPS
              value: "3"
            - name: OOD_MEDIAN_WINDOW
              value: "5"
            - name: OOD_SMOOTH_SAFETY_TH
              value: "true"
            - name: CENTROIDS_PATH
              value: "/app/centroids.npy"
            - name: INV_COV_MATRIX_PATH
              value: "/app/inv_cov_matrix.npy"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_HOST
              value: "localhost"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_IMAGE_TTL
              value: "3600"
        - image: redis:7-alpine
          name: redis
          volumeMounts:
            - name: redis-storage
              mountPath: /data
              readOnly: false
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: redis-pvc
        - name: fallback-storage
          persistentVolumeClaim:
            claimName: ood-queue-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ood-queue-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
